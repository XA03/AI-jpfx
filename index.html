<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>日幣課金匯率</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="日幣匯率">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1d2330;--sub:#6b7385;--line:#e3e6ec;--good:#0a8f4d;--bad:#d03a3a;--in:#fff8dc}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b202b;--text:#e8ebf2;--sub:#98a1b5;--line:#2b3242;--good:#3ecf85;--bad:#ff7070;--in:#2c2a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Noto Sans TC",sans-serif}
main{max-width:1180px;margin:0 auto;padding:16px}
.layout{display:grid;grid-template-columns:1fr;gap:0 16px;align-items:start}
.layout>*{min-width:0}
@media(min-width:900px){.layout{grid-template-columns:340px 1fr}aside{position:sticky;top:12px}}
h1{font-size:20px;margin:4px 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h2{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
h3{font-size:14px;margin:18px 0 8px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 12px}
.k{color:var(--sub);font-size:13px}.v{font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}
.bar{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),var(--good));margin:14px 0 4px}
.bar i{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:var(--text);transform:translateX(-2px)}
.lr{display:flex;justify-content:space-between;color:var(--sub);font-size:12px}
table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:5px 3px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{color:var(--sub);font-weight:500}
.wrap{overflow-x:auto}
tr.off td.o{opacity:.45}
button,input,select{font:inherit;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
input{width:100%;margin:4px 0 10px}
td input{margin:0;padding:4px 6px;background:var(--in);min-width:64px}
td input.nm{min-width:110px;text-align:left}
td input.qt{min-width:44px;width:52px}
td input[type=checkbox]{width:18px;min-width:0;height:18px}
.sub{color:var(--sub);font-size:13px}
.hide{display:none}
.row{display:flex;gap:8px}.row input{margin:0}.row select{flex:1;min-width:0;padding:6px 10px}
.x{padding:2px 8px}
/* 手機：項目表改成卡片，不用左右滑動 */
@media(max-width:700px){
  .wrap{overflow:visible}
  table,tbody{display:block;width:100%}
  tr.hd{display:none}
  tr[data-i]{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
  tr[data-i] td{display:block;border:0;padding:0;text-align:left;white-space:normal;min-width:0}
  tr[data-i] td[data-l]::before{content:attr(data-l);display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
  td.c-buy{grid-column:1/6;grid-row:1;display:flex!important;align-items:center}
  td.c-buy::after{content:'買';margin-left:8px}
  td.c-del{grid-column:6;grid-row:1;text-align:right!important}
  td.c-name{grid-column:1/-1;grid-row:2}
  td.o:nth-of-type(3){grid-column:span 2}
  td.o:nth-of-type(4){grid-column:span 2}
  td.o:nth-of-type(5){grid-column:span 2}
  td.c-res{grid-column:span 3;font-size:14px}
  tr[data-i] td input{width:100%;min-width:0;padding:8px 10px}
  tr[data-i] td input[type=checkbox]{width:22px;height:22px;padding:0}
  tr[data-i] .x{padding:4px 12px;font-size:18px}
}
.gbtn{color:var(--good);border-color:var(--good)}
.rbtn{color:var(--bad);border-color:var(--bad)}
.rbtn:disabled{opacity:.4;cursor:default}
dialog{width:min(92vw,380px);background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:16px}
dialog::backdrop{background:rgba(0,0,0,.45)}
#dyes{background:var(--text);color:var(--bg)}
</style>
</head>
<body>
<main>
  <h1>日幣課金匯率 <span><button id="reload">更新匯率</button> <button id="cfg">設定</button></span></h1>
  <div id="setup" class="card hide">
    <h2>連線設定（只用來取得匯率）</h2>
    <label class="k">Apps Script 網頁應用程式網址（/exec）</label>
    <input id="url" placeholder="https://script.google.com/macros/s/.../exec">
    <label class="k">密碼（TOKEN）</label>
    <input id="token" type="password">
    <button id="save">儲存並載入</button> <button id="demo">用示範匯率</button>
  </div>
  <dialog id="dlg">
    <h2 id="dtitle"></h2>
    <div id="dtext" class="sub"></div>
    <input id="dinput" class="hide">
    <div class="row" style="justify-content:flex-end;margin-top:12px">
      <button id="dno">取消</button><button id="dyes"></button>
    </div>
  </dialog>
  <div id="msg" class="sub"></div>
  <div class="layout">
    <aside>
      <div id="rate"></div>
      <h3>遊戲分類</h3>
      <div class="card">
        <div class="row"><select id="sel" aria-label="選擇遊戲"></select><button id="up" title="上移" aria-label="上移">▲</button><button id="down" title="下移" aria-label="下移">▼</button></div>
        <div id="pos" class="sub" style="margin-top:6px"></div>
        <div class="row" style="margin-top:8px"><button id="add" class="gbtn" style="flex:1">新增遊戲分類</button></div>
        <div class="row" style="margin-top:8px"><button id="delgame" class="rbtn" style="flex:1">刪除此遊戲</button></div>
        <div class="row" style="margin-top:8px"><button id="exp" style="flex:1">匯出 JSON</button><button id="imp" style="flex:1">匯入 JSON</button></div>
        <input id="file" type="file" accept=".json,application/json" class="hide">
      </div>
    </aside>
    <section id="local"></section>
  </div>

</main>
<script>
const $=id=>document.getElementById(id);
const fmt=(n,d=2)=>typeof n==='number'&&isFinite(n)?n.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
// 差額：負數 = 日區省錢（綠），正數 = 日區較貴（紅）
const pct=n=>typeof n==='number'&&isFinite(n)?`<span class="${n<0?'good':n>0?'bad':''}">${n>0?'+':''}${(n*100).toFixed(2)}%</span>`:'—';
const money=n=>typeof n==='number'&&isFinite(n)?`<span class="${n<0?'good':n>0?'bad':''}">${n>0?'+':''}${fmt(n)}</span>`:'—';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function put(k,v){try{localStorage.setItem(k,v)}catch(e){}}

let R=null, local=[];
try{R=JSON.parse(get('rate'))||null}catch(e){}
try{local=JSON.parse(get('local'))||[]}catch(e){}
const saveLocal=()=>put('local',JSON.stringify(local));

// ---------- 計算（與試算表邏輯相同） ----------
function calc(twd,jpy){
  twd=+twd;jpy=+jpy;
  if(!R||!(twd>0&&jpy>0))return null;
  const r=jpy/twd,t=jpy/R.current;
  return{rate:r,vsLow:(r-R.low)/R.low,vsHigh:(r-R.high)/R.high,vsNow:(r-R.current)/R.current,jpyAsTwd:t,diff:t-twd};
}
function cartOf(g){
  let tw=0,jp=0;
  g.items.forEach(i=>{if(i.buy){const q=+i.qty||0;tw+=q*(+i.twd||0);jp+=q*(+i.jpy||0)}});
  return{twd:tw,jpy:jp,c:calc(tw,jp)};
}
function cartHtml(t){
  const c=t.c;
  if(!c)return'<div class="sub">購物車沒有勾選項目，或還沒填價格（需先有匯率）</div>';
  return`<div class="grid">
    <div><div class="k">台區價合計</div><div class="v">${fmt(t.twd,0)} TWD</div></div>
    <div><div class="k">日區價合計</div><div class="v">${fmt(t.jpy,0)} JPY</div></div>
    <div><div class="k">整車隱含匯率</div><div class="v">${fmt(c.rate,4)}</div></div>
    <div><div class="k">相對目前</div><div class="v">${pct(c.vsNow)}</div></div>
    <div><div class="k">相對最虧</div><div class="v">${pct(c.vsLow)}</div></div>
    <div><div class="k">相對最賺</div><div class="v">${pct(c.vsHigh)}</div></div>
    <div><div class="k">日區折合台幣</div><div class="v">${fmt(c.jpyAsTwd)}</div></div>
    <div><div class="k">日區貴(+)/省(-) TWD</div><div class="v">${money(c.diff)}</div></div></div>`;
}

// ---------- 匯率卡 ----------
function renderRate(){
  if(!R){$('rate').innerHTML='';return}
  const span=R.high-R.low,p=span>0?Math.max(0,Math.min(1,(R.current-R.low)/span)):0.5;
  $('rate').innerHTML=`<div class="card"><h2>1 台幣 = ? 日幣</h2>
    <div class="grid">
      <div><div class="k">目前</div><div class="v">${fmt(R.current,4)}</div></div>
      <div><div class="k">一年平均</div><div class="v">${fmt(R.avg,4)}</div></div>
      <div><div class="k">最賺（日區最划算）${esc(R.highDate)}</div><div class="v">${fmt(R.high,4)}</div></div>
      <div><div class="k">最虧（日區最不划算）${esc(R.lowDate)}</div><div class="v">${fmt(R.low,4)}</div></div>
    </div>
    <div class="bar"><i style="left:${p*100}%"></i></div>
    <div class="lr"><span>最虧</span><span>目前位置 ${(p*100).toFixed(0)}%</span><span>最賺</span></div>
    <div class="sub">匯率更新 ${esc(R.updated)}　綠 = 日區省錢，紅 = 日區較貴</div></div>`;
}

// ---------- 我的計算（可編輯） ----------
function rowHtml(i,idx){
  return`<tr data-i="${idx}">
    <td class="c-buy"><input type="checkbox" data-f="buy" aria-label="買" ${i.buy?'checked':''}></td>
    <td class="o c-name" data-l="項目"><input class="nm" data-f="name" value="${esc(i.name)}" placeholder="項目"></td>
    <td class="o" data-l="數量"><input class="qt" data-f="qty" type="number" inputmode="decimal" step="any" value="${esc(i.qty)}"></td>
    <td class="o" data-l="台區價 (TWD)"><input data-f="twd" type="number" inputmode="decimal" step="any" value="${esc(i.twd)}" placeholder="台"></td>
    <td class="o" data-l="日區價 (JPY)"><input data-f="jpy" type="number" inputmode="decimal" step="any" value="${esc(i.jpy)}" placeholder="日"></td>
    <td class="o r1 c-res" data-l="隱含匯率"></td><td class="o r2 c-res" data-l="相對目前"></td><td class="o r3 c-res" data-l="相對最虧"></td><td class="o r4 c-res" data-l="相對最賺"></td>
    <td class="c-del"><button class="x" data-act="delrow" title="刪除此列" aria-label="刪除此列">×</button></td></tr>`;
}
let cur=get('cur');
function renderLocal(){
  if(!local.some(g=>String(g.id)===String(cur)))cur=local.length?String(local[0].id):'';
  put('cur',cur);
  $('sel').innerHTML=local.map((g,n)=>`<option value="${g.id}" ${String(g.id)===String(cur)?'selected':''}>${n+1}. ${esc(g.name)}</option>`).join('')||'<option>（尚無遊戲）</option>';
  $('sel').disabled=!local.length;$('delgame').disabled=!local.length;
  const pos=local.findIndex(g=>String(g.id)===String(cur));
  $('pos').textContent=pos>=0?'目前順位：第 '+(pos+1)+' / '+local.length+' 個':'';
  $('up').disabled=pos<=0;$('down').disabled=pos<0||pos>=local.length-1;
  $('local').innerHTML=local.filter(g=>String(g.id)===String(cur)).map(g=>`<div class="card" data-g="${g.id}">
    <h2><span>${esc(g.name)}</span></h2>
    <div class="k" style="margin-bottom:6px">購物車（只計入有勾選的項目 × 數量）</div>
    <div class="cart"></div>
    <div class="k" style="margin:12px 0 4px">項目（價格請填單價）</div>
    <div class="wrap"><table><tr class="hd"><th>買</th><th>項目</th><th>數量</th><th>台區價</th><th>日區價</th><th>匯率</th><th>目前</th><th>最虧</th><th>最賺</th><th></th></tr>
    ${g.items.map(rowHtml).join('')}</table></div>
    <div style="margin-top:8px"><button data-act="addrow">＋ 新增項目</button></div></div>`).join('')
    ||'<div class="sub">還沒有遊戲，先在上面新增一個。</div>';
  recalc();
}
// 只更新計算結果，不重建輸入欄（避免輸入中失去焦點）
function recalc(){
  document.querySelectorAll('#local .card[data-g]').forEach(card=>{
    const g=local.find(x=>String(x.id)===card.dataset.g);if(!g)return;
    card.querySelector('.cart').innerHTML=cartHtml(cartOf(g));
    card.querySelectorAll('tr[data-i]').forEach(tr=>{
      const i=g.items[+tr.dataset.i],c=calc(i.twd,i.jpy);
      tr.querySelectorAll('td.o').forEach(td=>td.style.opacity=i.buy?'':'.45');
      tr.querySelector('.r1').textContent=c?fmt(c.rate,4):'—';
      tr.querySelector('.r2').innerHTML=c?pct(c.vsNow):'—';
      tr.querySelector('.r3').innerHTML=c?pct(c.vsLow):'—';
      tr.querySelector('.r4').innerHTML=c?pct(c.vsHigh):'—';
    });
  });
}
const newItem=()=>({buy:false,name:'',qty:1,twd:'',jpy:''});
// 頁面內彈窗（不用 alert/confirm/prompt）。取消回傳 null；有輸入欄回傳文字，否則回傳 true
function ask(title,{input=false,placeholder='',ok='確定',text=''}={}){
  return new Promise(res=>{
    const d=$('dlg');
    $('dtitle').textContent=title;$('dtext').textContent=text;
    $('dtext').classList.toggle('hide',!text);
    $('dinput').classList.toggle('hide',!input);$('dinput').value='';$('dinput').placeholder=placeholder;
    $('dyes').textContent=ok;
    const done=v=>{d.close();res(v)};
    $('dyes').onclick=()=>done(input?($('dinput').value.trim()||null):true);
    $('dno').onclick=()=>done(null);
    d.oncancel=()=>res(null); // 按 Esc
    $('dinput').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();$('dyes').click()}};
    d.showModal();if(input)$('dinput').focus();
  });
}
async function addGame(){
  const name=await ask('新增遊戲分類',{input:true,placeholder:'遊戲名稱',ok:'新增'});
  if(!name)return;
  const id=Date.now();
  local.push({id,name,items:[newItem(),newItem(),newItem()]});
  cur=String(id);saveLocal();renderLocal();
}
$('add').onclick=addGame;

// ---------- JSON 匯出／匯入（跨裝置搬資料） ----------
$('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify({app:'jpy-twd',version:1,games:local},null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='日幣課金-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  $('msg').textContent='已匯出 '+local.length+' 個遊戲分類';
};
$('imp').onclick=()=>$('file').click();
$('file').onchange=async()=>{
  const f=$('file').files[0];$('file').value='';if(!f)return;
  let d;
  try{d=JSON.parse(await f.text())}catch(e){$('msg').textContent='匯入失敗：不是有效的 JSON 檔';return}
  const arr=Array.isArray(d)?d:d&&d.games;
  const games=(Array.isArray(arr)?arr:[]).filter(g=>g&&typeof g.name==='string'&&Array.isArray(g.items))
    .map((g,n)=>({id:Date.now()+n,name:g.name,
      items:g.items.map(i=>({buy:!!(i&&i.buy),name:String((i&&i.name)??''),qty:(i&&i.qty)??1,twd:(i&&i.twd)??'',jpy:(i&&i.jpy)??''}))}));
  if(!games.length){$('msg').textContent='匯入失敗：檔案裡找不到遊戲分類';return}
  const ok=await ask('匯入遊戲分類',{text:'檔案內有 '+games.length+' 個遊戲分類。匯入會覆蓋目前的 '+local.length+' 個，確定？',ok:'匯入'});
  if(!ok)return;
  local=games;cur=String(games[0].id);saveLocal();renderLocal();
  $('msg').textContent='已匯入 '+games.length+' 個遊戲分類';
};
$('local').addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f)return;
  const card=e.target.closest('.card'),g=local.find(x=>String(x.id)===card.dataset.g);
  const i=g.items[+e.target.closest('tr').dataset.i];
  i[f]=f==='buy'?e.target.checked:e.target.value;
  saveLocal();recalc();
});
$('sel').onchange=()=>{cur=$('sel').value;renderLocal()};
function move(d){
  const i=local.findIndex(x=>String(x.id)===String(cur)),j=i+d;
  if(i<0||j<0||j>=local.length)return;
  [local[i],local[j]]=[local[j],local[i]];
  saveLocal();renderLocal();
}
$('up').onclick=()=>move(-1);
$('down').onclick=()=>move(1);
$('delgame').onclick=async()=>{
  const g=local.find(x=>String(x.id)===String(cur));if(!g)return;
  const yes=await ask('刪除遊戲分類',{text:'確定刪除「'+g.name+'」和裡面所有項目？此動作無法復原。',ok:'刪除'});
  if(!yes)return;
  local=local.filter(x=>x!==g);saveLocal();renderLocal();
};
$('local').addEventListener('click',e=>{
  const act=e.target.dataset.act;if(!act)return;
  const card=e.target.closest('.card'),g=local.find(x=>String(x.id)===card.dataset.g);
  if(act==='addrow'){g.items.push(newItem());saveLocal();renderLocal();}
  else if(act==='delrow'){g.items.splice(+e.target.closest('tr').dataset.i,1);saveLocal();renderLocal();}
});

// ---------- 載入匯率 ----------
const DEMO={rate:{current:4.82,high:5.1,highDate:'2026/03/02',low:4.55,lowDate:'2026/09/20',avg:4.85,pos:0.49,updated:'示範'}};
function apply(d){
  R=d.rate;put('rate',JSON.stringify(R));
  renderRate();recalc();
}
async function load(){
  const url=get('url'),tk=get('token');
  if(!url){
    $('msg').textContent=R?'尚未設定連線，使用上次儲存的匯率。':'請先設定連線取得匯率，或用示範匯率。';
    if(!R)$('setup').classList.remove('hide');
    return;
  }
  $('msg').textContent='載入中…';
  try{
    const res=await fetch(url+(url.includes('?')?'&':'?')+'token='+encodeURIComponent(tk));
    const d=await res.json();
    if(d.error){$('msg').textContent='錯誤：'+d.error;return}
    $('msg').textContent='';apply(d);
  }catch(e){$('msg').textContent='連線失敗：'+e.message+(R?'（使用上次儲存的匯率）':'')}
}
$('cfg').onclick=()=>{$('url').value=get('url');$('setup').classList.toggle('hide')};
$('save').onclick=()=>{put('url',$('url').value.trim());put('token',$('token').value);$('setup').classList.add('hide');load()};
$('demo').onclick=()=>{$('setup').classList.add('hide');$('msg').textContent='使用示範匯率（非真實資料）';apply(DEMO)};
$('reload').onclick=load;

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
renderRate();renderLocal();load();
</script>
</body>
</html>
